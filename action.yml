name: SkillShield Scan
description: Scan AI agent skills for known prompt-injection, data-exfiltration and malicious-payload patterns before they are merged or installed.
author: Linda Oraegbunam
branding:
  icon: shield
  color: gray-dark

inputs:
  path:
    description: Files or directories to scan, one per line. Directories are scanned recursively.
    required: false
    default: "."
  fail-on:
    description: Fail the step when any file is at this risk level or above. One of critical, high, medium, low or none.
    required: false
    default: high
  min-severity:
    description: Ignore findings below this severity. One of critical, high, medium, low or info.
    required: false
    default: info
  sarif-file:
    description: Where to write the SARIF report. Defaults to a file in the runner's temporary directory.
    required: false
    default: ""

outputs:
  risk-level:
    description: The highest risk level found (SAFE, LOW, MEDIUM, HIGH or CRITICAL).
    value: ${{ steps.scan.outputs.risk-level }}
  scanned:
    description: The number of files scanned.
    value: ${{ steps.scan.outputs.scanned }}
  flagged:
    description: The number of files with at least one finding.
    value: ${{ steps.scan.outputs.flagged }}
  findings:
    description: The total number of findings.
    value: ${{ steps.scan.outputs.findings }}
  sarif-file:
    description: The path of the SARIF report, for github/codeql-action/upload-sarif.
    value: ${{ steps.scan.outputs.sarif-file }}

runs:
  using: composite
  steps:
    - name: Install SkillShield
      id: install
      shell: bash
      env:
        ACTION_PATH: ${{ github.action_path }}
      run: |
        PY="$(command -v python3 || command -v python || true)"
        if [ -z "$PY" ] || ! "$PY" -c 'import sys; sys.exit(sys.version_info < (3, 10))'; then
          echo "::error::SkillShield needs Python 3.10 or later. Add actions/setup-python before this step."
          exit 2
        fi
        VENV="$RUNNER_TEMP/skillshield-venv"
        "$PY" -m venv "$VENV"
        if [ -x "$VENV/bin/python" ]; then VPY="$VENV/bin/python"; else VPY="$VENV/Scripts/python.exe"; fi
        "$VPY" -m pip install --quiet --disable-pip-version-check "$ACTION_PATH"
        echo "python=$VPY" >> "$GITHUB_OUTPUT"

    - name: Scan skills
      id: scan
      shell: bash
      env:
        SKILLSHIELD_PYTHON: ${{ steps.install.outputs.python }}
        SKILLSHIELD_PATHS: ${{ inputs.path }}
        SKILLSHIELD_FAIL_ON: ${{ inputs.fail-on }}
        SKILLSHIELD_MIN_SEVERITY: ${{ inputs.min-severity }}
        SKILLSHIELD_SARIF_FILE: ${{ inputs.sarif-file || format('{0}/skillshield.sarif', runner.temp) }}
      run: '"$SKILLSHIELD_PYTHON" -m skillshield.ci'
