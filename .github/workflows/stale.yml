name: Mark stale issues and PRs

on:
  schedule:
    - cron: "0 6 * * 1" # Mondays at 06:00 UTC
  workflow_dispatch:

permissions:
  issues: write
  pull-requests: write

jobs:
  stale:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/stale@v11
        with:
          stale-issue-message: >
            This issue has had no activity for 60 days, so it is marked stale. It stays open:
            nothing here is closed by a bot. A comment removes the label; a maintainer closes
            it by hand if it is resolved or no longer relevant.
          stale-pr-message: >
            This pull request has had no activity for 30 days, so it is marked stale. It stays
            open: nothing here is closed by a bot. Push or comment and the label goes away. If
            you have moved on, a maintainer may offer it for adoption with your commits and
            credit kept (see CONTRIBUTING.md).
          days-before-issue-stale: 60
          days-before-pr-stale: 30
          # Never close automatically: stale is a signal for a maintainer.
          days-before-issue-close: -1
          days-before-pr-close: -1
          stale-issue-label: stale
          stale-pr-label: stale
          exempt-issue-labels: "pinned,security,good first issue,help wanted,adoptable,new-rule,roadmap"
          exempt-pr-labels: "pinned,security"
